<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: สนุกกับ Raspberry Pi - สัปดาห์ที่ 1</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Prompt', sans-serif;
            background: linear-gradient(135deg, #1e1b4b, #312e81, #4338ca);
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 25px;
            border-radius: 20px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        h1 { 
            font-size: 1.6rem; 
            margin-top: 0;
            margin-bottom: 15px; 
            color: #38bdf8; 
        }
        
        .login-box, #quiz-container, .score-container { 
            display: none; 
        }
        .login-box.active, #quiz-container.active, .score-container.active { 
            display: block; 
        }
        
        input[type="text"] {
            width: 90%;
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.3);
            background: rgba(0,0,0,0.25);
            color: #fff;
            font-family: 'Prompt', sans-serif;
            font-size: 1rem;
            margin: 15px 0 20px 0;
            text-align: center;
            outline: none;
        }
        input[type="text"]::placeholder { 
            color: #94a3b8; 
        }
        
        .start-btn, .choice-btn, #next-btn {
            font-family: 'Prompt', sans-serif;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .start-btn {
            background: #38bdf8; 
            color: #0f172a; 
            border: none;
            padding: 12px 30px; 
            border-radius: 10px; 
            font-size: 1rem; 
            font-weight: 600;
            width: 90%;
        }
        .start-btn:hover { 
            background: #0ea5e9; 
        }

        #progress { 
            font-size: 0.85rem; 
            color: #cbd5e1; 
            margin-bottom: 15px; 
            text-align: left;
        }
        .question-box { 
            font-size: 1.1rem; 
            margin-bottom: 20px; 
            font-weight: 600; 
            min-height: 55px; 
            text-align: left; 
            line-height: 1.5;
        }
        .choices { 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
        }
        .choice-btn {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #fff; 
            padding: 12px 15px; 
            border-radius: 10px;
            font-size: 0.95rem; 
            text-align: left;
            line-height: 1.4;
        }
        .choice-btn:hover:not(:disabled) { 
            background: rgba(56, 189, 248, 0.25); 
            border-color: #38bdf8; 
        }
        .choice-btn.correct { 
            background: #22c55e !important; 
            border-color: #16a34a !important; 
            color: #fff !important;
        }
        .choice-btn.incorrect { 
            background: #ef4444 !important; 
            border-color: #dc2626 !important; 
            color: #fff !important;
        }
        
        #next-btn {
            margin-top: 20px; 
            background: #38bdf8; 
            color: #0f172a; 
            border: none;
            padding: 10px 25px; 
            border-radius: 8px; 
            font-size: 1rem; 
            font-weight: 600;
            display: none; 
            width: 100%;
        }

        .score-container h2 { 
            font-size: 2rem; 
            color: #4ade80; 
            margin-bottom: 10px;
        }
        #final-score {
            font-size: 3rem;
            margin: 10px 0;
            color: #38bdf8;
        }
        .loading-text { 
            font-size: 0.9rem; 
            color: #38bdf8; 
            margin-top: 20px; 
            background: rgba(0,0,0,0.2);
            padding: 8px 12px;
            border-radius: 8px;
            display: none; 
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🍓 Raspberry Pi Quiz</h1>
        
        <!-- หน้าที่ 1: ลงทะเบียนก่อนทำ -->
        <div class="login-box active" id="login-box">
            <p>กรุณากรอกชื่อ-นามสกุล หรือชื่อเล่น<br>ก่อนเริ่มทำแบบทดสอบครับ</p>
            <input type="text" id="student-name" placeholder="เช่น น้องก็อต CPE" autocomplete="off">
            <br>
            <button class="start-btn" onclick="startQuiz()">เริ่มทำแบบทดสอบ 🚀</button>
        </div>

        <!-- หน้าที่ 2: ทำแบบทดสอบ -->
        <div id="quiz-container">
            <div id="progress">คำถามที่ 1 จาก 5</div>
            <div class="question-box" id="question-text"></div>
            <div class="choices" id="choices-box"></div>
            <button id="next-btn" onclick="nextQuestion()">ข้อถัดไป ➔</button>
        </div>

        <!-- หน้าที่ 3: สรุปผลและส่งคะแนน -->
        <div class="score-container" id="score-container">
            <h2>🎉 ทำแบบทดสอบเสร็จแล้ว!</h2>
            <p id="player-greeting" style="font-size: 1.1rem; color: #cbd5e1;"></p>
            <p style="margin-bottom: 0;">คะแนนที่คุณทำได้</p>
            <h1 id="final-score">0 / 5</h1>
            <p id="score-comment" style="font-weight: 600; font-size: 1.1rem;"></p>
            <div class="loading-text" id="loading-save">กำลังบันทึกคะแนนเข้าสู่ระบบ... ⏳</div>
        </div>
    </div>

    <script>
        // URL ของ Google Apps Script Web App
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwiRxiSGLaO1tWWIaYxVl7DWGcwKJStGX_OEdsxJYCRiTH9Lggpz8lX6yl_BcunKBAIVw/exec";

        const quizData = [
            {
                question: "1. ทำไมบอร์ดคอมพิวเตอร์จิ๋วเครื่องนี้ถึงชื่อว่า 'Raspberry Pi' โดยคำว่า 'Pi' มาจากอะไร?",
                choices: [
                    "ก) เป็นชื่อขนมพายรสราสเบอร์รี่", 
                    "ข) มาจากชื่อภาษา Python", 
                    "ค) ย่อมาจากคำว่า Pixel ความคมชัดสูง", 
                    "ง) มาจากค่าทางคณิตศาสตร์ (Math Pi)"
                ],
                correct: 1
            },
            {
                question: "2. ข้อใดคือ 'จุดเด่น' ของ Raspberry Pi ที่แตกต่างจากคอมพิวเตอร์ทั่วไปมากที่สุด?",
                choices: [
                    "ก) เล่นเกม 3D หนักๆ ได้ดีกว่าคอมพิวเตอร์ทั่วไป", 
                    "ข) ไม่ต้องใช้ไฟฟ้าเลย ใช้พลังงานแสงอาทิตย์อย่างเดียว", 
                    "ค) ตัวเล็กเท่าบัตรเครดิต และมีขา GPIO ต่อวงจรภายนอกได้", 
                    "ง) มีราคาแพงกว่าโน้ตบุ๊กทั่วไป 2 เท่า"
                ],
                correct: 2
            },
            {
                question: "3. หากเราต้องการใส่ระบบปฏิบัติการ (OS) ให้ Raspberry Pi เราต้องใส่อุปกรณ์ชิ้นใดลงไปใต้บอร์ด?",
                choices: [
                    "ก) แผ่นซีดีเกม (CD-ROM)", 
                    "ข) แฟลชไดรฟ์ USB ทั่วไป", 
                    "ค) MicroSD Card (การ์ดหน่วยความจำขนาดเล็ก)", 
                    "ง) สายชาร์จแบตเตอรี่มือถือ"
                ],
                correct: 2
            },
            {
                question: "4. ข้อใดกล่าวถึงการจ่ายไฟให้แก่ Raspberry Pi ได้ถูกต้องที่สุด?",
                choices: [
                    "ก) ต้องเสียบปลั๊กไฟบ้าน 220V โดยตรงเท่านั้น", 
                    "ข) ใช้พลังงานต่ำมาก สามารถใช้ไฟจาก Power Bank หรือหัวชาร์จมือถือได้", 
                    "ค) มีแบตเตอรี่ในตัวเครื่อง เปิดใช้งานได้ตลอด 24 ชั่วโมง", 
                    "ง) ใช้พลังงานจากหน้าจอคอมพิวเตอร์ผ่านสาย HDMI อย่างเดียว"
                ],
                correct: 1
            },
            {
                question: "5. ในชั่วโมงปฏิบัติการ เราได้ทดลองเขียนโค้ดภาษา Python สั่งงานเบื้องต้นผ่านโปรแกรมอะไร?",
                choices: [
                    "ก) Microsoft Word", 
                    "ข) Thonny Python IDE", 
                    "ค) Adobe Photoshop", 
                    "ง) Minecraft"
                ],
                correct: 1
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let answered = false;
        let playerName = "";

        function startQuiz() {
            const nameInput = document.getElementById("student-name").value.trim();
            if (!nameInput) {
                alert("กรุณากรอกชื่อก่อนเริ่มเล่นด้วยนะครับ!");
                return;
            }
            playerName = nameInput;
            document.getElementById("login-box").classList.remove("active");
            document.getElementById("quiz-container").classList.add("active");
            loadQuestion();
        }

        function loadQuestion() {
            answered = false;
            document.getElementById("next-btn").style.display = "none";
            const q = quizData[currentQuestion];
            document.getElementById("progress").innerText = `คำถามที่ ${currentQuestion + 1} จาก ${quizData.length}`;
            document.getElementById("question-text").innerText = q.question;
            const choicesBox = document.getElementById("choices-box");
            choicesBox.innerHTML = "";

            q.choices.forEach((choice, index) => {
                const btn = document.createElement("button");
                btn.className = "choice-btn";
                btn.innerText = choice;
                btn.onclick = () => selectChoice(index, btn);
                choicesBox.appendChild(btn);
            });
        }

        function selectChoice(selectedIndex, selectedBtn) {
            if (answered) return;
            answered = true;

            const q = quizData[currentQuestion];
            const allBtns = document.getElementById("choices-box").getElementsByClassName("choice-btn");

            if (selectedIndex === q.correct) {
                selectedBtn.classList.add("correct");
                score++;
            } else {
                selectedBtn.classList.add("incorrect");
                allBtns[q.correct].classList.add("correct");
            }

            Array.from(allBtns).forEach(btn => btn.disabled = true);

            if (currentQuestion < quizData.length - 1) {
                document.getElementById("next-btn").style.display = "block";
            } else {
                setTimeout(showScore, 1000);
            }
        }

        function nextQuestion() {
            currentQuestion++;
            loadQuestion();
        }

        function showScore() {
            document.getElementById("quiz-container").classList.remove("active");
            document.getElementById("score-container").classList.add("active");
            document.getElementById("player-greeting").innerText = `คุณ ${playerName}`;
            document.getElementById("final-score").innerText = `${score} / ${quizData.length}`;
            
            if (score === 5) {
                document.getElementById("score-comment").innerText = "สุดยอด! คว้าคะแนนเต็มไปเลย 🌟";
            } else if (score >= 3) {
                document.getElementById("score-comment").innerText = "เก่งมาก ผ่านฉลุย! 👍";
            } else {
                document.getElementById("score-comment").innerText = "เยี่ยมมากที่ตั้งใจทำจนจบ! 💪";
            }

            // ส่งข้อมูลคะแนนเข้า Google Sheets
            saveScoreToSheets();
        }

        function saveScoreToSheets() {
            if (!SCRIPT_URL) return;
            
            const loadingElem = document.getElementById("loading-save");
            loadingElem.style.display = "block";
            
            const data = {
                name: playerName,
                score: score,
                total: quizData.length
            };

            fetch(SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            }).then(() => {
                loadingElem.innerText = "บันทึกคะแนนเข้าสู่ระบบเรียบร้อยแล้ว! ✅";
            }).catch(() => {
                loadingElem.innerText = "บันทึกคะแนนไม่สำเร็จ (โปรดตรวจสอบอินเทอร์เน็ต)";
            });
        }
    </script>
</body>
</html>
