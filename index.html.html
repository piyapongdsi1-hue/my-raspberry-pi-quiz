<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: สนุกกับ Raspberry Pi - สัปดาห์ที่ 1</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background: linear-gradient(135deg, #1e1b4b, #312e81, #4338ca);
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 30px;
            border-radius: 20px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        h1 { font-size: 1.8rem; margin-bottom: 10px; color: #38bdf8; }
        .login-box, #quiz-container, .score-container { display: none; }
        .login-box.active, #quiz-container.active, .score-container.active { display: block; }
        
        input[type="text"] {
            width: 80%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.3);
            background: rgba(0,0,0,0.2);
            color: #fff;
            font-family: 'Prompt', sans-serif;
            font-size: 1rem;
            margin: 15px 0;
            text-align: center;
        }
        input[type="text"]::placeholder { color: #94a3b8; }
        
        .start-btn, .choice-btn, .restart-btn {
            font-family: 'Prompt', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .start-btn {
            background: #38bdf8; color: #0f172a; border: none;
            padding: 12px 30px; border-radius: 10px; font-size: 1rem; font-weight: 600;
        }
        .start-btn:hover { background: #0ea5e9; }

        #progress { font-size: 0.9rem; color: #cbd5e1; margin-bottom: 20px; }
        .question-box { font-size: 1.2rem; margin-bottom: 20px; font-weight: 600; min-height: 60px; text-align: left; }
        .choices { display: flex; flex-direction: column; gap: 12px; }
        .choice-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff; padding: 12px 20px; border-radius: 10px;
            font-size: 1rem; text-align: left;
        }
        .choice-btn:hover:not(:disabled) { background: rgba(56, 189, 248, 0.3); border-color: #38bdf8; }
        .choice-btn.correct { background: #22c55e !important; border-color: #16a34a !important; }
        .choice-btn.incorrect { background: #ef4444 !important; border-color: #dc2626 !important; }
        
        #next-btn {
            margin-top: 25px; background: #38bdf8; color: #0f172a; border: none;
            padding: 10px 25px; border-radius: 8px; font-size: 1rem; font-weight: 600;
            display: none; cursor: pointer;
        }
        .score-container h2 { font-size: 2.2rem; color: #4ade80; }
        .loading-text { font-size: 0.9rem; color: #38bdf8; margin-top: 10px; display: none; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🍓 Raspberry Pi Quiz</h1>
        
        <!-- หน้าลงทะเบียนก่อนเล่น -->
        <div class="login-box active" id="login-box">
            <p>กรุณากรอกชื่อ-นามสกุล หรือชื่อเล่น ก่อนเริ่มทำแบบทดสอบ</p>
            <input type="text" id="student-name" placeholder="เช่น ด.ช.รักเรียน โคדי้ง" autocomplete="off">
            <br>
            <button class="start-btn" onclick="startQuiz()">เริ่มทำแบบทดสอบ 🚀</button>
        </div>

        <!-- หน้าคำถาม -->
        <div id="quiz-container">
            <div id="progress">คำถามที่ 1 จาก 5</div>
            <div class="question-box" id="question-text"></div>
            <div class="choices" id="choices-box"></div>
            <button id="next-btn" onclick="nextQuestion()">ข้อถัดไป ➔</button>
        </div>

        <!-- หน้าสรุปผลคะแนน -->
        <div class="score-container" id="score-container">
            <h2>🎉 ยินดีด้วยครับ!</h2>
            <p id="player-greeting"></p>
            <p>คะแนนที่คุณทำได้</p>
            <h1 id="final-score">0 / 5</h1>
            <p id="score-comment"></p>
            <div class="loading-text" id="loading-save">กำลังบันทึกคะแนนเข้าสู่ระบบ... ⏳</div>
        </div>
    </div>

    <script>
        // ** ⚠️ นำ URL ของ Google Apps Script ที่ได้จากการ Deploy มาวางแทนที่ข้อความด้านล่างนี้ **
        const SCRIPT_URL = "const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwiRxiSGLaO1tWWIaYxVl7DWGcwKJStGX_OEdsxJYCRiTH9Lggpz8lX6yl_BcunKBAIVw/exec";

        const quizData = [
            {
                question: "1. ทำไมบอร์ดคอมพิวเตอร์จิ๋วเครื่องนี้ถึงชื่อว่า 'Raspberry Pi' โดยคำว่า 'Pi' มาจากอะไร?",
                choices: ["ก) ขนมพายรสราสเบอร์รี่", "ข) มาจากภาษา Python", "ค) ย่อมาจาก Pixel", "ง) มาจากค่าพาย Math Pi"],
                correct: 1
            },
            {
                question: "2. ข้อใดคือ 'จุดเด่น' ของ Raspberry Pi ที่ต่างจากคอมพิวเตอร์ทั่วไปมากที่สุด?",
                choices: ["ก) เล่นเกม 3D หนักๆ ได้ดีกว่า", "ข) ใช้พลังงานแสงอาทิตย์อย่างเดียว", "ค) ตัวเล็กเท่าบัตรเครดิต มีขา GPIO ต่อวงจรได้", "ง) ราคาแพงกว่าโน้ตบุ๊ก 2 เท่า"],
                correct: 2
            },
            {
                question: "3. หากเราต้องการใส่ระบบปฏิบัติการ (OS) ให้ Pi เราต้องใช้อุปกรณ์ชิ้นใด?",
                choices: ["ก) แผ่นซีดีรอม", "ข) แฟลชไดรฟ์ USB ทั่วไป", "ค) MicroSD Card", "ง) สายชาร์จมือถือ"],
                correct: 2
            },
            {
                question: "4. ข้อใดกล่าวถึงการจ่ายไฟให้แก่ Raspberry Pi ได้ถูกต้องที่สุด?",
                choices: ["ก) ต้องเสียบปลั๊กไฟบ้าน 220V เท่านั้น", "ข) ใช้ไฟต่ำ ใช้กับ Power Bank หรือหัวชาร์จมือถือได้", "ค) มีแบตเตอรี่ในตัว เปิดได้ 24 ชม.", "ง) ใช้ไฟจากจอผ่านสาย HDMI อย่างเดียว"],
                correct: 1
            },
            {
                question: "5. เราได้ทดลองเขียนโค้ดภาษา Python สั่งงานเบื้องต้นผ่านโปรแกรมอะไร?",
                choices: ["ก) Microsoft Word", "ข) Thonny Python IDE", "ค) Adobe Photoshop", "ง) Minecraft"],
                correct: 1
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let answered = false;
        let playerName = "";

        function startQuiz() {
            const nameInput = document.getElementById("student-name").value.trim();
            if (!nameInput) {
                alert("รบกวนกรอกชื่อก่อนเริ่มเล่นด้วยนะครับ!");
                return;
            }
            playerName = nameInput;
            document.getElementById("login-box").classList.remove("active");
            document.getElementById("quiz-container").classList.add("active");
            loadQuestion();
        }

        function loadQuestion() {
            answered = false;
            document.getElementById("next-btn").style.display = "none";
            const q = quizData[currentQuestion];
            document.getElementById("progress").innerText = `คำถามที่ ${currentQuestion + 1} จาก ${quizData.length}`;
            document.getElementById("question-text").innerText = q.question;
            const choicesBox = document.getElementById("choices-box");
            choicesBox.innerHTML = "";

            q.choices.forEach((choice, index) => {
                const btn = document.createElement("button");
                btn.className = "choice-btn";
                btn.innerText = choice;
                btn.onclick = () => selectChoice(index, btn);
                choicesBox.appendChild(btn);
            });
        }

        function selectChoice(selectedIndex, selectedBtn) {
            if (answered) return;
            answered = true;

            const q = quizData[currentQuestion];
            const allBtns = document.getElementById("choices-box").getElementsByClassName("choice-btn");

            if (selectedIndex === q.correct) {
                selectedBtn.classList.add("correct");
                score++;
            } else {
                selectedBtn.classList.add("incorrect");
                allBtns[q.correct].classList.add("correct");
            }

            Array.from(allBtns).forEach(btn => btn.disabled = true);

            if (currentQuestion < quizData.length - 1) {
                document.getElementById("next-btn").style.display = "inline-block";
            } else {
                setTimeout(showScore, 1000);
            }
        }

        function nextQuestion() {
            currentQuestion++;
            loadQuestion();
        }

        function showScore() {
            document.getElementById("quiz-container").classList.remove("active");
            document.getElementById("score-container").classList.add("active");
            document.getElementById("player-greeting").innerText = `คุณ ${playerName}`;
            document.getElementById("final-score").innerText = `${score} / ${quizData.length}`;
            
            if (score === 5) {
                document.getElementById("score-comment").innerText = "สุดยอด! คว้าเต็มไปเลย 🌟";
            } else if (score >= 3) {
                document.getElementById("score-comment").innerText = "เก่งมาก ผ่านฉลุย! 👍";
            } else {
                document.getElementById("score-comment").innerText = "เยี่ยมมากที่ตั้งใจทำจนจบ! 💪";
            }

            // ส่งข้อมูลคะแนนเข้า Google Sheets
            saveScoreToSheets();
        }

        function saveScoreToSheets() {
            if (SCRIPT_URL === "YOUR_GOOGLE_APPS_SCRIPT_URL_HERE") return;
            
            document.getElementById("loading-save").style.display = "block";
            
            const data = {
                name: playerName,
                score: score,
                total: quizData.length
            };

            fetch(SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            }).then(() => {
                document.getElementById("loading-save").innerText = "บันทึกคะแนนเรียบร้อยแล้ว! ✅";
            }).catch(() => {
                document.getElementById("loading-save").innerText = "บันทึกคะแนนไม่สำเร็จ (เกิดข้อผิดพลาดเน็ต)";
            });
        }
    </script>
</body>
</html>
